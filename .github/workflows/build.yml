name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      - name: Install dependencies
        run: npm install

      - name: Prepare keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "Using keystore from secret"
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-keystore.jks
          else
            echo "No secret found — generating temporary keystore"
            keytool -genkey -v \
              -keystore android-keystore.jks \
              -alias allfreshman \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass TempPass2026 \
              -keypass TempPass2026 \
              -dname "CN=All Freshman ET, OU=Mobile, O=Osee, L=Addis Ababa, ST=Addis Ababa, C=ET"
          fi

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Patch MainActivity with FLAG_SECURE
        run: |
          FILE=$(find android -name MainActivity.java | head -1)
          echo "Patching: $FILE"

          grep -q "import android.view.WindowManager;" "$FILE" || \
            sed -i 's|import com.getcapacitor.BridgeActivity;|import android.view.WindowManager;\nimport com.getcapacitor.BridgeActivity;|' "$FILE"

          grep -q "FLAG_SECURE" "$FILE" || \
            sed -i 's|super.onCreate(savedInstanceState);|super.onCreate(savedInstanceState);\n        getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);|' "$FILE"

          grep -q "FLAG_SECURE" "$FILE" || (echo "PATCH FAILED — MainActivity not modified" && exit 1)

      - name: Build signed AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android-keystore.jks \
            -Pandroid.injected.signing.store.password=TempPass2026 \
            -Pandroid.injected.signing.key.alias=allfreshman \
            -Pandroid.injected.signing.key.password=TempPass2026

      - name: Build signed APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android-keystore.jks \
            -Pandroid.injected.signing.store.password=TempPass2026 \
            -Pandroid.injected.signing.key.alias=allfreshman \
            -Pandroid.injected.signing.key.password=TempPass2026

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AllFreshman-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AllFreshman-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Cleanup keystore from runner
        if: always()
        run: rm -f android-keystore.jks
