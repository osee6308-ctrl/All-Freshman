name: Build Android

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Restore keystore (stable signing key)
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android-keystore.jks
          test -s android-keystore.jks || (echo "Keystore missing — set KEYSTORE_BASE64 secret" && exit 1)

      - name: Add Android platform
        run: |
          npx cap add android || true
          npx cap sync android

      - name: Patch MainActivity with FLAG_SECURE
        run: |
          FILE=$(find android -name MainActivity.java | head -1)
          echo "Patching: $FILE"

          # Add WindowManager import if not already present
          grep -q "import android.view.WindowManager;" "$FILE" || \
            sed -i 's|import com.getcapacitor.BridgeActivity;|import android.view.WindowManager;\nimport com.getcapacitor.BridgeActivity;|' "$FILE"

          # Add FLAG_SECURE inside onCreate if not already present
          grep -q "FLAG_SECURE" "$FILE" || \
            sed -i 's|super.onCreate(savedInstanceState);|super.onCreate(savedInstanceState);\n        getWindow().setFlags(WindowManager.LayoutParams.FLAG_SECURE, WindowManager.LayoutParams.FLAG_SECURE);|' "$FILE"

          # Fail loudly if the patch didn't stick
          grep -q "FLAG_SECURE" "$FILE" || (echo "PATCH FAILED — MainActivity not modified" && exit 1)
          grep -q "import android.view.WindowManager;" "$FILE" || (echo "IMPORT FAILED" && exit 1)

          echo "----- MainActivity.java (verify) -----"
          sed -n '1,40p' "$FILE"

      - name: Build signed AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android-keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Build signed APK
        working-directory: android
        run: |
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android-keystore.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEYSTORE_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AllFreshman-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: AllFreshman-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Cleanup keystore from runner
        if: always()
        run: rm -f android-keystore.jks
