<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Photo Icon Generator</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: linear-gradient(135deg,#1e3c72,#2a5298 50%,#6a3093); min-height: 100vh; margin: 0; padding: 20px; color: #fff; }
  .wrap { max-width: 560px; margin: 0 auto; }
  .panel { background: #fff; color: #222; border-radius: 16px; padding: 22px; box-shadow: 0 10px 30px rgba(0,0,0,.25); }
  h1 { font-size: 20px; margin: 0 0 6px; color: #333; }
  p { font-size: 13.5px; color: #666; line-height: 1.7; margin: 8px 0; }
  .drop { border: 2px dashed #bbb; border-radius: 12px; padding: 30px; text-align: center; background: #fafafa; cursor: pointer; margin: 14px 0; }
  .drop:active { background: #f0e9f8; border-color: #6a3093; }
  input[type=file] { display: none; }
  canvas { display: block; margin: 12px auto; border-radius: 12px; box-shadow: 0 6px 18px rgba(0,0,0,.15); }
  .btns { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
  button { padding: 14px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; background: #6a3093; color: #fff; }
  button:active { opacity: .7; }
  button:disabled { opacity: .4; }
  .alt { background: #4caf50; }
  .alt2 { background: #ff9800; }
  .preview-row { display: flex; gap: 14px; align-items: flex-start; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .lbl { font-size: 11px; font-weight: 700; color: #666; text-transform: uppercase; text-align: center; margin-top: 6px; }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>📸 Photo → App Icon</h1>
    <p>Select your graduation photo below. The app crops it to a square and generates 3 PNG files.</p>

    <div class="drop" id="dropBox" onclick="document.getElementById('fileInput').click()">
      <div style="font-size: 40px;">📷</div>
      <div style="font-weight: 700; margin-top: 8px;">Tap to choose photo</div>
      <div style="font-size: 12px; color: #888; margin-top: 4px;">Any JPG or PNG from your gallery</div>
    </div>
    <input type="file" id="fileInput" accept="image/*">

    <div id="previewArea" class="hidden">
      <div class="preview-row">
        <div>
          <canvas id="c192" width="192" height="192"></canvas>
          <div class="lbl">192 × 192</div>
        </div>
        <div>
          <canvas id="c512" width="512" height="512" style="width: 140px; height: 140px;"></canvas>
          <div class="lbl">512 × 512</div>
        </div>
      </div>

      <div class="btns">
        <button onclick="download('192')">⬇ Download icon-192.png</button>
        <button class="alt" onclick="download('512')">⬇ Download icon-512.png</button>
        <button class="alt2" onclick="download('maskable')">⬇ Download icon-maskable-512.png</button>
      </div>
    </div>
  </div>
</div>

<script>
var sourceImage = null;

document.getElementById('fileInput').addEventListener('change', function(e){
  var f = e.target.files[0];
  if(!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    var img = new Image();
    img.onload = function(){
      sourceImage = img;
      document.getElementById('dropBox').innerHTML = '<div style="font-size: 13px; color: #2e7d32; font-weight: 700;">✅ Photo loaded</div><div style="font-size: 12px; color: #666; margin-top: 4px;">Tap again to change</div>';
      document.getElementById('previewArea').classList.remove('hidden');
      drawIcon(document.getElementById('c192'), 192, false);
      drawIcon(document.getElementById('c512'), 512, false);
    };
    img.src = ev.target.result;
  };
  r.readAsDataURL(f);
});

function drawIcon(canvas, size, maskable){
  if(!sourceImage) return;
  var ctx = canvas.getContext('2d');
  var W = size, H = size;

  // For maskable icons we shrink the visible area to 80% and pad with purple
  var pad = maskable ? size * 0.1 : 0;
  var inner = size - pad * 2;

  // Fill maskable background with purple first
  if (maskable) {
    ctx.fillStyle = '#6a3093';
    ctx.fillRect(0, 0, W, H);
  }

  // Center-crop the source image to a square
  var sw = sourceImage.width;
  var sh = sourceImage.height;
  var s = Math.min(sw, sh);
  var sx = (sw - s) / 2;
  var sy = (sh - s) / 2;

  ctx.drawImage(sourceImage, sx, sy, s, s, pad, pad, inner, inner);

  // Subtle inner glow on maskable version
  if (maskable) {
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = size * 0.01;
    ctx.strokeRect(pad, pad, inner, inner);
  }
}

function makeCanvas(size, maskable){
  var c = document.createElement('canvas');
  c.width = size;
  c.height = size;
  drawIcon(c, size, maskable);
  return c;
}

function download(type){
  if(!sourceImage) { alert('Select a photo first'); return; }
  var canvas, filename;
  if (type === '192') { canvas = makeCanvas(192, false); filename = 'icon-192.png'; }
  else if (type === '512') { canvas = makeCanvas(512, false); filename = 'icon-512.png'; }
  else { canvas = makeCanvas(512, true); filename = 'icon-maskable-512.png'; }

  canvas.toBlob(function(blob){
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 1000);
    alert('✅ Downloaded: ' + filename);
  }, 'image/png', 1.0);
}
</script>
</body>
</html>
