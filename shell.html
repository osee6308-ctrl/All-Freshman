<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>All Freshman ET</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#6a3093">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="All Freshman">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg,#1e3c72,#2a5298 50%,#6a3093);
    color: #fff;
    font-family: system-ui,-apple-system,sans-serif;
    text-align: center;
    padding: 20px;
    -webkit-user-select: none;
    user-select: none;
  }
  .shell-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeIn .5s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* === LOGO (image) === */
  .logo {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center;
    margin-bottom: 20px;
    box-shadow: 0 10px 34px rgba(0,0,0,.4);
    border: 4px solid rgba(255,255,255,.30);
    animation: pulse 1.4s ease-in-out infinite;
    background: #1e3c72;
    display: block;
  }

  /* === FALLBACK (emoji) === */
  .logo-fallback {
    width: 130px;
    height: 130px;
    border-radius: 50%;
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 62px;
    background: rgba(255,255,255,.12);
    border: 4px solid rgba(255,255,255,.25);
    box-shadow: 0 10px 34px rgba(0,0,0,.4);
    animation: pulse 1.4s ease-in-out infinite;
  }

  h1 {
    font-size: 21px;
    margin-bottom: 8px;
    font-weight: 800;
    letter-spacing: .3px;
  }
  p {
    font-size: 13.5px;
    opacity: .85;
    line-height: 1.6;
  }
  .bar {
    width: 180px;
    height: 4px;
    margin: 22px auto 0;
    background: rgba(255,255,255,.2);
    border-radius: 10px;
    overflow: hidden;
  }
  .bar span {
    display: block;
    height: 100%;
    width: 40%;
    background: #fff;
    border-radius: 10px;
    animation: slide 1.1s ease-in-out infinite;
  }
  .version {
    position: fixed;
    bottom: 14px;
    left: 0;
    right: 0;
    font-size: 10.5px;
    opacity: .55;
    letter-spacing: .5px;
  }
  @keyframes slide {
    0%   { transform: translateX(-100%); }
    100% { transform: translateX(250%); }
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); }
    50%     { transform: scale(1.06); }
  }
</style>
</head>
<body>
  <div class="shell-wrap">
    <img
      class="logo"
      src="logo.png"
      alt="All Freshman ET"
      onerror="this.outerHTML='<div class=&quot;logo-fallback&quot;>🎓</div>'">
    <h1>All Freshman ET</h1>
    <p>Loading your study hub…</p>
    <div class="bar"><span></span></div>
  </div>
  <div class="version">v1.0</div>

<script>
  (function () {
    var TARGET = 'app.html';
    var MIN_MS = 700;
    var MAX_MS = 4000;
    var started = Date.now();

    function go() {
      var elapsed = Date.now() - started;
      var wait = Math.max(0, MIN_MS - elapsed);
      setTimeout(function () {
        try { location.replace(TARGET); }
        catch (e) { window.location.href = TARGET; }
      }, wait);
    }

    // Prefetch app.html while splash shows — faster perceived load
    try {
      var link = document.createElement('link');
      link.rel = 'prefetch';
      link.href = TARGET;
      document.head.appendChild(link);
    } catch (e) {}

    if (document.readyState === 'complete') {
      go();
    } else {
      window.addEventListener('load', go);
    }

    // Safety net
    setTimeout(function () {
      try { location.replace(TARGET); } catch (e) {}
    }, MAX_MS);
  })();
</script>
</body>
</html>
