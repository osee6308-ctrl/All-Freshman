(function(){
  function applyZoom(v){
    v = String(v);
    try { localStorage.setItem('app_zoom', v); } catch(e){}
    document.documentElement.style.zoom = v;
    if (document.body) document.body.style.zoom = v;
  }
  window.setAppZoom = function(v){
    applyZoom(v);
    if (typeof window.renderMy === 'function') window.renderMy();
  };
  window.getAppZoom = function(){
    return parseFloat(localStorage.getItem('app_zoom') || '1');
  };
  window._applySavedZoom = function(){
    applyZoom(localStorage.getItem('app_zoom') || '1');
  };
  // Apply on load
  applyZoom(localStorage.getItem('app_zoom') || '1');
})();

    const stored = JSON.parse(localStorage.getItem(LS_SETTINGS)||'{}');
    const merged = { ...DEFAULT_CONFIG, ...stored };
    if (stored.TRIAL_UNIVERSITY && !stored.TRIAL_UNIVERSITIES) merged.TRIAL_UNIVERSITIES = [stored.TRIAL_UNIVERSITY];
    if (stored.TRIAL_SUBJECT && !stored.TRIAL_SUBJECTS) merged.TRIAL_SUBJECTS = [stored.TRIAL_SUBJECT];
    if (!Array.isArray(merged.TRIAL_UNIVERSITIES) || merged.TRIAL_UNIVERSITIES.length === 0) {
      merged.TRIAL_UNIVERSITIES = [merged.TRIAL_UNIVERSITY || 'Arsi University'];
    }
    if (!Array.isArray(merged.TRIAL_SUBJECTS) || merged.TRIAL_SUBJECTS.length === 0) {
      merged.TRIAL_SUBJECTS = [merged.TRIAL_SUBJECT || 'english'];
    }
    if (!Array.isArray(merged.TRIAL_EXAM_KEYWORDS)) merged.TRIAL_EXAM_KEYWORDS = [];
    if (!Array.isArray(merged.TRIAL_NOTE_KEYWORDS)) merged.TRIAL_NOTE_KEYWORDS = [];
    if (!Array.isArray(merged.TRIAL_COC_KEYWORDS)) merged.TRIAL_COC_KEYWORDS = [];
    if (!Array.isArray(merged.PAYMENT_METHODS) || merged.PAYMENT_METHODS.length === 0) {
      const m = [];
      if (stored.TELEBIRR) m.push({name:'Telebirr', number:stored.TELEBIRR});
      if (stored.CBE_BIRR) m.push({name:'CBE Birr', number:stored.CBE_BIRR});
      if (stored.AWASH_BANK) m.push({name:'Awash Bank', number:stored.AWASH_BANK});
      if (stored.EBIRR) m.push({name:'E-Birr', number:stored.EBIRR});
      merged.PAYMENT_METHODS = m.length ? m : DEFAULT_CONFIG.PAYMENT_METHODS;
    }
    return merged;
  } catch(e){ return { ...DEFAULT_CONFIG }; }
}

function isValidLicenseKey(key){ if(!key||typeof key!=='string') return false; const c=key.trim().toUpperCase(); if(!/^FH-[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(c)) return false; const p=c.split('-'); const expected=simpleHash(CONFIG.SECRET+p[1]+p[3]).slice(0,4).toUpperCase().padStart(4,'0'); return p[2]===expected; }

function tryActivateLicense(key){ const c=(key||'').trim().toUpperCase(); if(!c) return {ok:false,reason:'empty'}; const curPhone=getCurrentUserPhone()||''; if(isMasterKey(c)){ setBlocked(false); localStorage.setItem(LS_LICENSE,c); localStorage.setItem(LS_LICENSE_ACTIVATED,Date.now().toString()); if(curPhone) localStorage.setItem(LS_ACT_PHONE,curPhone); resetKeyAttempts(); return {ok:true,master:true}; } if(!isValidLicenseKey(c)) return {ok:false,reason:'invalid'}; if(!isLicenseForThisDevice(c)){ const r=registerWrongKey(); if(r.blocked) return {ok:false,reason:'blocked',blockCount:r.blockCount}; return {ok:false,reason:'wrong-device',remaining:r.remaining}; } setBlocked(false); localStorage.setItem(LS_LICENSE,c); localStorage.setItem(LS_LICENSE_ACTIVATED,Date.now().toString()); if(curPhone) localStorage.setItem(LS_ACT_PHONE,curPhone); resetKeyAttempts(); return {ok:true}; }
function checkAccess(){
  if(isAdminMode()) return { status:'licensed', daysLeft:9999, master:true, admin:true };
  const curPhone = getCurrentUserPhone();
  const actPhone = localStorage.getItem(LS_ACT_PHONE) || '';
  const samePhone = !!curPhone && String(curPhone).replace(/[^\d]/g,'') === String(actPhone).replace(/[^\d]/g,'');
  if(samePhone && localStorage.getItem(LS_ADMIN_ACTIVATED)==='1'){ const act = parseInt(localStorage.getItem(LS_ADMIN_ACTIVATED_AT)||'0'); if(act){ const end = act + CONFIG.LICENSE_DAYS*86400000; if(Date.now() < end) return { status:'licensed', daysLeft: Math.ceil((end-Date.now())/86400000), source:'admin' }; } }
  const l = samePhone ? localStorage.getItem(LS_LICENSE) : null;
  if(l && isMasterKey(l)) return {status:'licensed',daysLeft:9999,master:true};
  if(l && isValidLicenseKey(l)){ let activated=parseInt(localStorage.getItem(LS_LICENSE_ACTIVATED)||'0'); if(!activated){ activated=Date.now(); localStorage.setItem(LS_LICENSE_ACTIVATED,String(activated)); } const end=activated+CONFIG.LICENSE_DAYS*86400000; const now=Date.now(); if(now>=end) return {status:'expired',reason:'license-expired'}; return {status:'licensed',daysLeft:Math.ceil((end-now)/86400000)}; }
  const u=getCurrentUser(); let fr=u&&u.createdAt?u.createdAt:parseInt(localStorage.getItem(LS_FIRST_RUN)||'0'); if(!fr){ fr=Date.now(); localStorage.setItem(LS_FIRST_RUN,fr.toString()); } const end=fr+CONFIG.TRIAL_DAYS*86400000; const now=Date.now(); if(now>=end) return {status:'expired',reason:'trial-ended'}; return {status:'trial',daysLeft:Math.ceil((end-now)/86400000)};
}

function normalizeLibrary(lib){ if(!lib||typeof lib!=='object') return {}; const out={}; Object.keys(lib).forEach(uni=>{ if(META_KEYS.has(uni)) return; out[uni]={}; CONFIG.STREAMS.forEach(stream=>{ const s=(lib[uni]&&lib[uni][stream])||null; if(!s){ out[uni][stream]={"1":{pdfs:[],notes:[],exams:[],cocs:[]},"2":{pdfs:[],notes:[],exams:[],cocs:[]}}; return; } if(s.pdfs||s.notes||s.exams||s.cocs){ out[uni][stream]={"1":{pdfs:s.pdfs||[],notes:s.notes||[],exams:s.exams||[],cocs:s.cocs||[]},"2":{pdfs:[],notes:[],exams:[],cocs:[]}}; } else { const s1=s["1"]||{}; const s2=s["2"]||{}; out[uni][stream]={"1":{pdfs:s1.pdfs||[],notes:s1.notes||[],exams:s1.exams||[],cocs:s1.cocs||[]},"2":{pdfs:s2.pdfs||[],notes:s2.notes||[],exams:s2.exams||[],cocs:s2.cocs||[]}}; } }); }); return out; }
function getContentLibrary(){

    const vRes = await fetch(base + '/version.json?t=' + Date.now(), { cache:'no-store' });
    if (vRes.ok) {
      const vData = await vRes.json();
      remoteVersion = String(vData.version || '1');
      if (remoteVersion === localVersion && localStorage.getItem(LS_SYNCED_CONTENT)) {
        console.log('Content up to date (v' + localVersion + ')');
        return;
      }
    }
  } catch(e){}
  try {
    const res = await fetch(base + '/content.json?t=' + Date.now(), { cache:'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const remote = await res.json();
    if (!remote) return;
    localStorage.setItem(LS_SYNCED_CONTENT, JSON.stringify(remote));
    localStorage.setItem(LS_SYNCED_VERSION, remoteVersion || String(remote.version || '1'));
    localStorage.setItem(LS_SYNCED_UPDATED, String(remote.updated || ''));
    if (remote.tutorials) saveTutorials(remote.tutorials);
    if (remote.universityInfo && typeof remote.universityInfo === 'object')
      localStorage.setItem(LS_UNI_INFO, JSON.stringify(remote.universityInfo));
    if (remote.generalSubjects && typeof remote.generalSubjects === 'object')
      localStorage.setItem(LS_GENERAL_SUBJECTS, JSON.stringify(remote.generalSubjects));
    if (remote.settings){
      const cur = getSettings();
      const remoteEdited = remote.settings._adminEdited || 0;
      const localEdited = cur._adminEdited || 0;
      if (remoteEdited > localEdited){ saveSettings({...cur, ...remote.settings}); reloadConfig(); }
    }
    console.log('Synced v' + (remoteVersion || remote.version || 1));
  } catch(e){ console.log('Offline'); }
}

function appDialog(type, message, defaultValue){
  return new Promise((resolve) => {
    const existing = document.getElementById('appDialogOverlay');
    if(existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.id = 'appDialogOverlay';
    overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:999999;display:flex;align-items:center;justify-content:center;padding:20px;';

        + '<button id="appDlgOk" class="btn btn-primary btn-full">OK</button>';

      inner = '<div style="font-size:15px;color:#333;line-height:1.6;margin-bottom:20px;white-space:pre-wrap;word-break:break-word;">'+escapeHtml(message)+'</div>'

        + '<button id="appDlgOk" class="btn btn-primary" style="flex:1;">OK</button>'
        + '</div>';
    } else if(type === 'prompt'){
      inner = '<div style="font-size:15px;color:#333;line-height:1.6;margin-bottom:12px;white-space:pre-wrap;word-break:break-word;">'+escapeHtml(message)+'</div>'
        + '<input type="text" id="appDlgInput" class="field-input" value="'+escapeAttr(defaultValue||'')+'" style="margin-bottom:16px;">'
        + '<div style="display:flex;gap:8px;">'
        + '<button id="appDlgCancel" class="btn btn-ghost" style="flex:1;">Cancel</button>'
        + '<button id="appDlgOk" class="btn btn-primary" style="flex:1;">OK</button>'
        + '</div>';
    }
    overlay.innerHTML = '<div style="background:#fff;border-radius:16px;padding:22px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);">'+inner+'</div>';
    document.body.appendChild(overlay);
    const okBtn = document.getElementById('appDlgOk');

    const cleanup = () => { overlay.remove(); };

  });
}

function _startQuizTimer(totalSeconds) {
  if (quizState.timerId) clearInterval(quizState.timerId);
  quizState.timerId = setInterval(()=>{
    quizState.seconds++; quizState.examSecondsElapsed++;
    if (totalSeconds > 0) {
      quizState.examSecondsLeft--;
      const el = document.getElementById('timerEl');
      if (el) {
        el.textContent = formatTime(Math.max(0, quizState.examSecondsLeft));
        if (quizState.examSecondsLeft <= 60) { el.style.background='rgba(255,71,87,.25)'; el.style.color='#ff4757'; }
      }
      if (quizState.examSecondsLeft <= 0) { clearInterval(quizState.timerId); finishExam(true); }
    } else {
      const el = document.getElementById('timerEl');
      if (el) el.textContent = formatTime(quizState.examSecondsElapsed);
    }
  }, 1000);
}

function adminGenerateActivationKey(){
  const hashEl = document.getElementById('actDeviceHash'); const secEl = document.getElementById('actSecret'); const out = document.getElementById('actResult');

  try { const list = JSON.parse(localStorage.getItem(LS_ADMIN_KEYS)||'[]'); list.unshift({ key:key, hash:hash, name:uName, phone:uPhone, at:Date.now() }); localStorage.setItem(LS_ADMIN_KEYS, JSON.stringify(list.slice(0,50))); } catch(e){}

  out.innerHTML = '<div style="background:#e8f5e9;border:2px solid #4caf50;border-radius:14px;padding:18px;text-align:center;"><div style="font-size:11px;color:#2e7d32;font-weight:800;letter-spacing:1px;margin-bottom:8px;">LICENSE KEY</div><div style="font-family:monospace;font-size:22px;font-weight:900;color:#2e7d32;letter-spacing:2px;word-break:break-all;margin-bottom:14px;">'+key+'</div>'+(uName?'<div style="font-size:12px;color:#666;margin-bottom:10px;">For: '+escapeHtml(uName)+'</div>':'')+'<button class="btn btn-primary btn-full" onclick="adminCopyKey(\''+key+'\')">📋 Copy Key</button><a href="'+tg+'" target="_blank" class="btn btn-telegram btn-full" style="display:block;text-align:center;text-decoration:none;margin-top:8px;">📨 Share via Telegram</a></div>';

async function adminSubmitBulk(){
  if(!isAdminMode()) return;
  const uni = (document.getElementById('bulkUni')||{}).value || adminBulkState.uni;
  const stream = adminBulkState.stream || 'Natural';
  const semester = adminBulkState.semester || 1;
  if(!uni) return appAlert('Choose university');
  const status = document.getElementById('bulkStatus');
  status.textContent = 'Processing…';
  const bookName = (document.getElementById('bulkBookName').value||'').trim();
  const bookChapter = (document.getElementById('bulkBookChapter').value||'').trim();
  const bookYear = (document.getElementById('bulkBookYear').value||'').trim();
  const bookDesc = (document.getElementById('bulkBookDesc').value||'').trim();
  const bookUrl = (document.getElementById('bulkBookUrl').value||'').trim();
  const noteTitle = (document.getElementById('bulkNoteTitle').value||'').trim();
  const noteBody = (document.getElementById('bulkNoteBody').value||'').trim();
  const noteUrl = (document.getElementById('bulkNoteUrl').value||'').trim();
  const examName = (document.getElementById('bulkExamName').value||'').trim();
  const examChapter = (document.getElementById('bulkExamChapter').value||'').trim();
  const examYear = (document.getElementById('bulkExamYear').value||'').trim();
  const examTime = parseInt((document.getElementById('bulkExamTime')||{}).value) || 0;
  const examText = (document.getElementById('bulkExamText').value||'').trim();
  const examUrl = (document.getElementById('bulkExamUrl').value||'').trim();
  const cocNameEl = document.getElementById('bulkCocName');
  const cocName = cocNameEl ? (cocNameEl.value||'').trim() : '';
  const cocChapterEl = document.getElementById('bulkCocChapter');
  const cocChapter = cocChapterEl ? (cocChapterEl.value||'').trim() : '';
  const cocYearEl = document.getElementById('bulkCocYear');
  const cocYear = cocYearEl ? (cocYearEl.value||'').trim() : '';
  const cocTimeEl = document.getElementById('bulkCocTime');
  const cocTime = cocTimeEl ? (parseInt(cocTimeEl.value)||0) : 0;
  const cocTextEl = document.getElementById('bulkCocText');
  const cocText = cocTextEl ? (cocTextEl.value||'').trim() : '';
  const cocUrlEl = document.getElementById('bulkCocUrl');
  const cocUrl = cocUrlEl ? (cocUrlEl.value||'').trim() : '';
  const hasBook = !!(bookName || bookUrl);
  const hasNote = !!(noteTitle || noteBody || noteUrl);
  const hasExam = !!(examName || examText || examUrl);
  const hasCoc = !!(cocName || cocText || cocUrl);
  if(!hasBook && !hasNote && !hasExam && !hasCoc){ status.textContent=''; return appAlert('Fill at least one section'); }
  if(hasCoc && semester !== 1){ status.textContent=''; return appAlert('COC can only be added in 1st semester.'); }
  try {
    const c = getUniContent(uni, stream, semester);
    const added = { books:0, notes:0, exams:0, cocs:0 };
    if(hasBook){ if(!bookName){ status.textContent=''; return appAlert('Module needs a name'); } if(!bookUrl){ status.textContent=''; return appAlert('Module needs a URL'); } c.pdfs.push({name: bookName, chapter: bookChapter, year: bookYear, description: bookDesc, url: bookUrl}); added.books++; }
    if(hasNote){ if(!noteTitle){ status.textContent=''; return appAlert('Note needs a title'); } if(!noteBody && !noteUrl){ status.textContent=''; return appAlert('Note needs a body or URL'); } c.notes.push({title: noteTitle, body: noteBody, url: noteUrl}); added.notes++; }
    if(hasExam){ if(!examName){ status.textContent=''; return appAlert('Exam needs a name'); } const qs = examText ? parseQuestions(examText) : []; if(!qs.length && !examUrl){ status.textContent=''; return appAlert('Exam needs questions or URL'); } c.exams.push({name: examName, chapter: examChapter, year: examYear, timeMinutes: examTime, questions: qs, url: examUrl}); added.exams++; }
    if(hasCoc){ if(!cocName){ status.textContent=''; return appAlert('COC needs a name'); } const qs = cocText ? parseQuestions(cocText) : []; if(!qs.length && !cocUrl){ status.textContent=''; return appAlert('COC needs questions or URL'); } c.cocs = c.cocs || []; c.cocs.push({name: cocName, chapter: cocChapter, year: cocYear, timeMinutes: cocTime, questions: qs, url: cocUrl}); added.cocs++; }
    setUniContent(uni, stream, semester, c);
    status.textContent = '';
    await appAlert('✅ Added:\n• '+added.books+' module(s)\n• '+added.notes+' note(s)\n• '+added.exams+' exam(s)\n• '+added.cocs+' COC(s)');
    renderAdminContentManager('exam');
  } catch(e){ status.textContent = ''; await appAlert('Error: '+e.message); }
}

function parseQuestions(text){
  const lines=text.split('\n').map(l=>l.trim()).filter(Boolean);
  const questions=[]; let current=null, answerKeyMode=false; const answerKey={};
  for(const line of lines){
    if(/^answer\s*key\b/i.test(line)||/^answers?\s*[:\-]?\s*$/i.test(line)){ if(current&&current.options.length>=2){ questions.push(current); current=null; } answerKeyMode=true; continue; }
    if(answerKeyMode){ const m=line.match(/^(\d+)\s*[.):\-]\s*([A-Da-d])\b/); if(m) answerKey[parseInt(m[1])]=m[2].toUpperCase(); continue; }
    const aM=line.match(/^(?:answer|ans)\s*[:\-]?\s*([A-Da-d])\b/i); if(aM&&current){ current.inlineAnswer=aM[1].toUpperCase(); continue; }
    const eM=line.match(/^(?:explanation|why|reason)\s*[:\-]\s*(.+)/i); if(eM&&current){ current.explanation=eM[1].trim(); continue; }
    const qM=line.match(/^(\d+)\s*[.)]\s+(.+)/); const oM=line.match(/^([A-Da-d])\s*[.)]\s+(.+)/);
    if(qM){ if(current&&current.options.length>=2) questions.push(current); current={q:qM[2].trim(),options:[]}; }
    else if(oM&&current){ current.options.push(oM[2].trim()); }
    else if(current){ if(current.options.length===0) current.q+=' '+line; else current.options[current.options.length-1]+=' '+line; }
  }
  if(current&&current.options.length>=2) questions.push(current);
  questions.forEach((q,i)=>{ const l=q.inlineAnswer||answerKey[i+1]; if(l) q.answer=l.charCodeAt(0)-65; delete q.inlineAnswer; });
  return questions.filter(q=>q.options.length>=2);
}
