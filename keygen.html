<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Key Generator</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family: system-ui; }
  body { min-height:100vh; padding:20px; background: linear-gradient(135deg,#1e3c72,#6a3093); color:#fff; display:flex; flex-direction:column; align-items:center; }
  .box { width:100%; max-width:480px; }
  h1 { font-size:20px; margin-bottom:6px; text-align:center; }
  .warn { background:#ff4757; color:#fff; padding:10px 14px; border-radius:10px; font-size:12px; font-weight:700; text-align:center; margin-bottom:14px; }
  .card { background:#fff; color:#222; border-radius:16px; padding:22px; box-shadow:0 10px 30px rgba(0,0,0,.3); margin-bottom:14px; }
  .card h2 { font-size:16px; color:#4a2568; margin-bottom:12px; }
  input, button, textarea, select { width:100%; padding:13px; font-size:14px; border-radius:10px; border:none; margin:6px 0; font-family:inherit; }
  input, textarea, select { background:#f7f7fa; color:#222; border:2px solid #e0e0e6; }
  .hash-input { font-family:monospace; text-transform:uppercase; letter-spacing:3px; font-size:18px; text-align:center; }
  button { background:#6a3093; color:#fff; font-weight:700; cursor:pointer; }
  button.green { background:#4caf50; }
  button.orange { background:#ff9800; }
  button.red { background:#ff4757; }
  .key { background:#f0e9f8; color:#6a3093; font-family:'Courier New',monospace; font-size:16px; font-weight:800; padding:16px; border-radius:12px; text-align:center; margin:10px 0; word-break:break-all; letter-spacing:2px; border:2px dashed #6a3093; min-height:56px; display:flex; align-items:center; justify-content:center; }
  .info { background:rgba(255,255,255,.1); padding:14px; border-radius:10px; font-size:12.5px; line-height:1.65; margin-top:14px; }
  .info code { background:rgba(255,255,255,.2); padding:2px 6px; border-radius:4px; font-family:monospace; }
  .tabs { display:flex; gap:4px; margin-bottom:14px; background:rgba(255,255,255,.15); padding:6px; border-radius:14px; }
  .tabs button { flex:1; padding:10px 4px; background:transparent; border-radius:8px; font-size:12px; }
  .tabs button.active { background:#fff; color:#4a2568; }
  .hist-item { background:#f7f7fa; border-radius:10px; padding:12px; margin-bottom:8px; font-size:12.5px; border-left:4px solid #6a3093; color:#333; }
  .hist-item .row { display:flex; justify-content:space-between; margin-bottom:4px; }
  .hist-item .row strong { color:#6a3093; }
  .hist-item.master { border-left-color:#c62828; }
  .hist-item.payment { border-left-color:#ff9800; }
  label { display:block; font-size:11px; font-weight:700; color:#666; margin:10px 0 4px; text-transform:uppercase; }
  .gate { position:fixed; inset:0; background:#1e3c72; display:flex; align-items:center; justify-content:center; z-index:9999; padding:20px; }
  .gate .card { max-width:380px; text-align:center; }
  .gate h2 { color:#4a2568; margin-bottom:14px; }
  .gate input { text-align:center; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <div class="card">
    <h2>🔒 Admin Access</h2>
    <p style="font-size:12.5px;color:#666;margin-bottom:10px;line-height:1.6;">Enter password to continue</p>
    <input type="password" id="gatePw" placeholder="Password" onkeydown="if(event.key==='Enter')checkGate()">
    <button onclick="checkGate()">Unlock</button>
    <div id="gateMsg" style="color:#c62828;font-size:12px;margin-top:8px;font-weight:700;"></div>
  </div>
</div>

<div class="box" id="app" style="display:none;">
  <h1>Admin Panel</h1>
  <div class="warn">PRIVATE — Never share this file</div>
  <div class="tabs">
    <button id="tabKey" class="active" onclick="switchTab('key')">🔑 Keys</button>
    <button id="tabPay" onclick="switchTab('pay')">💰 Payment</button>
    <button id="tabHist" onclick="switchTab('hist')">📜 History</button>
  </div>

  <div class="card" id="paneKey">
    <h2>🔑 Generate License Key</h2>
    <label>Device Hash (4 characters)</label>
    <input type="text" id="deviceHash" class="hash-input" placeholder="XXXX" maxlength="4">
    <button class="green" onclick="generateKey()">Generate Key</button>
    <div class="key" id="out">—</div>
    <button class="orange" onclick="copyKey()">📋 Copy Key</button>
    <button class="red" onclick="genMaster()">Generate Master Key</button>
  </div>

  <div class="card" id="panePay" style="display:none;">
    <h2>💰 Issue Key After Payment</h2>
    <label>User Name</label><input type="text" id="payName" placeholder="Abel Tadesse">
    <label>Phone</label><input type="tel" id="payPhone" placeholder="09xxxxxxxx">
    <label>University</label><input type="text" id="payUni" placeholder="Arsi University">
    <label>Stream</label><select id="payStream"><option value="">— Select —</option><option value="Natural">Natural</option><option value="Social">Social</option></select>
    <label>Method</label><select id="payMethod"><option value="">— Select —</option><option>Telebirr</option><option>CBE Birr</option><option>Awash Bank</option><option>E-Birr</option></select>
    <label>FT Number</label><input type="text" id="payFt" placeholder="FT24ABC123XYZ" style="text-transform:uppercase; font-family:monospace;">
    <label>Device Hash</label><input type="text" id="payHash" class="hash-input" placeholder="XXXX" maxlength="4">
    <button class="green" onclick="generateAndSavePaymentKey()">🔑 Generate Key</button>
    <div class="key" id="payOut">—</div>
    <button class="orange" onclick="copyPayKey()">📋 Copy Key</button>
  </div>

  <div class="card" id="paneHist" style="display:none;">
    <h2>📜 Issued Keys</h2>
    <div id="histList"></div>
    <button class="red" onclick="clearHistory()" style="margin-top:10px;">Clear History</button>
  </div>

  <div class="info" style="text-align:center;"><strong>Owner:</strong> Osama Abdi · <strong>Price:</strong> 200 ETB<br>Telebirr: <code>0924956308</code></div>
</div>

<script>
const SECRET = "FreshmanHub2024EthiopiaSecretKey2024";
const MASTER_KEY = "MASTER-UNBLOCK-ALL";
const LS_KEY_HISTORY = 'fh_keygen_history';
const ADMIN_PASSWORD = 'osama2024';

function simpleHash(str){ let h=0; for(let i=0;i<str.length;i++){ h=((h<<5)-h)+str.charCodeAt(i); h|=0; } return Math.abs(h).toString(36).toUpperCase(); }
function computeKey(dh){ dh=(dh||'').trim().toUpperCase(); if(!/^[A-Z0-9]{4}$/.test(dh)) return null; const rand=simpleHash(Date.now().toString()+Math.random()).slice(0,4).toUpperCase().padStart(4,'0'); const check=simpleHash(SECRET+dh+rand).slice(0,4).toUpperCase().padStart(4,'0'); return 'FH-'+dh+'-'+check+'-'+rand; }
function escapeHtml(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function checkGate(){
  const pw = document.getElementById('gatePw').value;
  if(pw === ADMIN_PASSWORD){
    sessionStorage.setItem('fh_keygen_unlocked','1');
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
  } else {
    document.getElementById('gateMsg').textContent = 'Wrong password';
    document.getElementById('gatePw').value = '';
  }
}
(function(){
  if(sessionStorage.getItem('fh_keygen_unlocked') === '1'){
    document.getElementById('gate').style.display='none';
    document.getElementById('app').style.display='block';
  }
})();

function switchTab(t){
  document.getElementById('paneKey').style.display = (t==='key')?'block':'none';
  document.getElementById('panePay').style.display = (t==='pay')?'block':'none';
  document.getElementById('paneHist').style.display = (t==='hist')?'block':'none';
  document.getElementById('tabKey').classList.toggle('active', t==='key');
  document.getElementById('tabPay').classList.toggle('active', t==='pay');
  document.getElementById('tabHist').classList.toggle('active', t==='hist');
  if(t==='hist') renderHistory();
}

function generateKey(){
  const dh = (document.getElementById('deviceHash').value||'').trim().toUpperCase();
  if(!/^[A-Z0-9]{4}$/.test(dh)){ alert('Enter valid 4-character hash.'); return; }
  const key = computeKey(dh);
  document.getElementById('out').textContent = key;
  saveToHistory({ type:'key', deviceHash:dh, key, at:Date.now() });
}

function genMaster(){
  if(!confirm('Generate MASTER key?\n\nThis unlocks ANY device forever.')) return;
  document.getElementById('out').textContent = MASTER_KEY;
  saveToHistory({ type:'master', key:MASTER_KEY, at:Date.now() });
}

function copyKey(){
  const t = document.getElementById('out').textContent;
  if(t==='—' || !t) return alert('Generate a key first!');
  copyToClipboard(t);
}

function copyPayKey(){
  const t = document.getElementById('payOut').textContent;
  if(t==='—' || !t) return alert('Generate a key first!');
  copyToClipboard(t);
}

function copyToClipboard(t){
  if(navigator.clipboard) navigator.clipboard.writeText(t).then(()=>alert('Copied:\n'+t)).catch(()=>fallbackCopy(t));
  else fallbackCopy(t);
}

function fallbackCopy(t){
  const ta = document.createElement('textarea');
  ta.value = t;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand('copy'); alert('Copied:\n'+t); }
  catch(e){ alert('Key: '+t); }
  document.body.removeChild(ta);
}

function generateAndSavePaymentKey(){
  const name = document.getElementById('payName').value.trim();
  const phone = document.getElementById('payPhone').value.trim();
  const uni = document.getElementById('payUni').value.trim();
  const stream = document.getElementById('payStream').value;
  const method = document.getElementById('payMethod').value;
  const ft = document.getElementById('payFt').value.trim().toUpperCase();
  const dh = document.getElementById('payHash').value.trim().toUpperCase();
  if(!name) return alert('Enter name');
  if(!/^(09|07)\d{8}$/.test(phone)) return alert('Enter valid phone (09/07 + 8 digits)');
  if(!uni) return alert('Enter university');
  if(!stream) return alert('Select stream');
  if(!method) return alert('Select payment method');
  if(!ft) return alert('Enter FT number');
  if(!/^[A-Z0-9]{4}$/.test(dh)) return alert('Enter valid device hash');
  const key = computeKey(dh);
  document.getElementById('payOut').textContent = key;
  saveToHistory({ type:'payment', name, phone, uni, stream, method, ft, deviceHash:dh, key, at:Date.now() });
  alert('✅ Key issued for '+name+'\n\nKey: '+key+'\n\nSend it to them on Telegram.');
}

function saveToHistory(entry){
  try {
    const h = JSON.parse(localStorage.getItem(LS_KEY_HISTORY)||'[]');
    h.unshift(entry);
    localStorage.setItem(LS_KEY_HISTORY, JSON.stringify(h.slice(0,200)));
  } catch(e){}
}

function renderHistory(){
  const el = document.getElementById('histList');
  let h = [];
  try { h = JSON.parse(localStorage.getItem(LS_KEY_HISTORY)||'[]'); } catch(e){}
  if(!h.length){ el.innerHTML = '<div style="text-align:center;padding:20px;color:#999;font-size:13px;">No keys issued yet.</div>'; return; }
  el.innerHTML = h.map(e=>{
    if(e.type === 'master'){
      return '<div class="hist-item master"><div class="row"><strong>MASTER KEY</strong><span>'+new Date(e.at).toLocaleString()+'</span></div><div style="font-family:monospace;">'+e.key+'</div></div>';
    }
    if(e.type === 'payment'){
      return '<div class="hist-item payment"><div class="row"><strong>'+escapeHtml(e.name)+'</strong><span>'+new Date(e.at).toLocaleDateString()+'</span></div><div style="font-size:11.5px;color:#666;">'+escapeHtml(e.phone)+' · '+escapeHtml(e.uni)+' · FT '+escapeHtml(e.ft)+'</div><div style="font-family:monospace;font-size:12px;background:#fff;padding:6px 10px;border-radius:6px;margin-top:4px;">'+e.key+'</div></div>';
    }
    return '<div class="hist-item"><div class="row"><strong>Hash '+escapeHtml(e.deviceHash)+'</strong><span>'+new Date(e.at).toLocaleDateString()+'</span></div><div style="font-family:monospace;font-size:12px;background:#fff;padding:6px 10px;border-radius:6px;">'+e.key+'</div></div>';
  }).join('');
}

function clearHistory(){
  if(!confirm('Clear all key history?')) return;
  localStorage.removeItem(LS_KEY_HISTORY);
  renderHistory();
}

document.getElementById('deviceHash').addEventListener('keydown', e=>{ if(e.key==='Enter') generateKey(); });
document.getElementById('payHash').addEventListener('keydown', e=>{ if(e.key==='Enter') generateAndSavePaymentKey(); });
</script>
</body>
</html>
